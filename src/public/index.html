<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>FORGE | Community Platform</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#2374ab",
            "royal-slate-blue": "#2374ab",
            "primary-container": "#2374ab",
            "warm-coral": "#ff8484",
            "ice-blue": "#95b8d1",
            "muted-slate": "#666a86",
            "sage-white": "#f3f8f2",
            "deep-obsidian": "#191919",
            "dark-charcoal": "#333333",
            "outline": "#717880",
            "on-surface": "#ffffff",
            "surface-variant": "#2a2a2a",
            "secondary": "#a13c3f",
            "border-translucent": "rgba(255, 255, 255, 0.12)"
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #191919;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .spring-progress {
      transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-spring-fill {
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .btn-spring-fill::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(35, 116, 171, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
      z-index: -1;
    }

    .btn-spring-fill:hover::before {
      width: 300%;
      height: 300%;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #191919;
    }
    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 10px;
    }

    /* Modal styling overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-card {
      background: #202020;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.75rem;
      padding: 1.75rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #95b8d1;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    .form-control {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.5rem;
      padding: 0.6rem 0.8rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: #2374ab;
    }
  </style>
</head>
<body class="bg-deep-obsidian text-white min-h-screen selection:bg-royal-slate-blue/30 overflow-x-hidden">

  <!-- Top Navigation Bar -->
  <header class="fixed top-0 w-full z-50 bg-deep-obsidian/90 backdrop-blur-md border-b border-white/10 transition-all duration-300">
    <div class="flex justify-between items-center h-16 px-4 md:px-8 max-w-7xl mx-auto">
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-royal-slate-blue text-3xl">bolt</span>
          <span class="font-black text-2xl tracking-tighter text-white uppercase">FORGE</span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-royal-slate-blue/20 text-ice-blue border border-royal-slate-blue/40">v0.50-alpha</span>
        </div>
        <nav class="hidden md:flex items-center gap-6">
          <button class="nav-tab text-sm font-semibold text-royal-slate-blue border-b-2 border-royal-slate-blue pb-1 transition-all" data-tab="dashboard">
            Dashboard
          </button>
          <button class="nav-tab text-sm font-semibold text-outline hover:text-white transition-colors" data-tab="tasks">
            Tasks & Marketplace
          </button>
          <button class="nav-tab text-sm font-semibold text-outline hover:text-white transition-colors" data-tab="teams">
            Teams
          </button>
        </nav>
      </div>

      <!-- Header Right: User Account Switcher -->
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 text-xs text-outline hidden sm:flex">
          <span>Switch Context:</span>
          <select id="userSelector" class="bg-white/5 border border-white/15 rounded px-2 py-1 text-xs text-white outline-none cursor-pointer hover:border-royal-slate-blue">
            <option value="u_dev">Aaron (Dev / Owner)</option>
            <option value="u_leader1">Sarah Jenkins (Leader)</option>
            <option value="u_teacher">Prof. Vance (Teacher)</option>
            <option value="u_op1">Alex Rivera (Operative)</option>
            <option value="u_op2">Elena Rostova (Operative)</option>
          </select>
        </div>

        <div id="currentUserBadge" class="flex items-center gap-2.5 bg-white/5 px-3 py-1.5 rounded-full border border-white/10 hover:border-royal-slate-blue/50 transition-colors cursor-pointer">
          <span id="userTagBadge" class="text-xs font-semibold text-royal-slate-blue">Code Ninja</span>
          <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-royal-slate-blue to-ice-blue p-[1px] flex items-center justify-center">
            <span class="material-symbols-outlined text-sm text-white">person</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="appView" class="pt-24 pb-16 px-4 md:px-8 max-w-7xl mx-auto min-h-[calc(100vh-64px)]">
    <!-- Dynamic views injected here by app.js -->
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
